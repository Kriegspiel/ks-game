name: Codecov Tests Run

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install build tooling
      run: python -m pip install build twine
    - name: Build and validate distributions
      run: |
        python -m build
        python -m twine check --strict dist/*
    - name: Install wheel and test extras
      run: |
        for wheel in dist/*.whl; do
          python -m pip install "${wheel}[test]"
        done
        python -m pip check
    - name: Test installed wheel and collect coverage
      working-directory: ${{ runner.temp }}
      run: >-
        python -m pytest "$GITHUB_WORKSPACE/tests"
        -c "$GITHUB_WORKSPACE/pyproject.toml" --import-mode=importlib
        --cov-config="$GITHUB_WORKSPACE/pyproject.toml"
        --cov-report=xml:"$GITHUB_WORKSPACE/coverage.xml"
    - name: Upload coverage reports to Codecov with GitHub Action
      if: matrix.python-version == '3.15'
      uses: codecov/codecov-action@v3
